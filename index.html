<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texly – Launching Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    /* Logo in corner */
    .corner-logo {
      position: absolute;
      top: 20px;
      left: 25px;
    }

    .corner-logo img {
      width: 90px;
    }

    /* Main box */
    .container {
      max-width: 420px;
      width: 100%;
      padding: 40px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 25px;
      opacity: 0.9;
      line-height: 1.6;
    }

    /* Button */
    .form-btn {
      display: inline-block;
      padding: 15px 32px;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .form-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(0, 114, 255, 0.45);
    }

    .note {
      margin-top: 20px;
      font-size: 0.95rem;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <div class="corner-logo">
    <img src="images/texly-logo.png" alt="Texly Logo">
  </div>

  <!-- Content -->
  <div class="container">
    <h1>Texly</h1>
    <p>
      Thank you for your interest in Texly 💙<br>
      We are preparing powerful Arabic–English translation and text services.
    </p>

    <!-- FORM BUTTON -->
    <a
      href="https://docs.google.com/forms/d/e/1FAIpQLScFUBChfy15UhohaOYtpSjVDk9pkCwXV9VBEQcLnaYvw8rqoQ/viewform?usp=header"
      target="_blank"
      class="form-btn"
    >
      📝 Go to the Form
    </a>

    <div class="note">
      We truly appreciate your trust and support 🚀
    </div>
  </div>

</body>
</html>
