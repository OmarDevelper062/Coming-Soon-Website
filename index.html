<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- GLOBAL MOBILE FIX (IMPORTANT) -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Texly – Launching Soon</title>

  <style>
    /* ===== GLOBAL RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    /* ===== LOGO ===== */
    .corner-logo {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 10;
    }

    .corner-logo img {
      width: 90px;
    }

    /* ===== BACKGROUND GLOW ===== */
    .glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #00c6ff55, transparent 70%);
      filter: blur(90px);
      animation: float 6s ease-in-out infinite alternate;
    }

    .glow.one {
      top: -120px;
      left: -120px;
    }

    .glow.two {
      bottom: -120px;
      right: -120px;
      animation-delay: 2s;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(35px); }
    }

    /* ===== CARD ===== */
    .container {
      position: relative;
      z-index: 2;
      max-width: 420px;
      width: 90%;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      animation: fadeUp 0.9s ease forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2.6rem;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 28px;
      opacity: 0.95;
      line-height: 1.7;
      font-size: 1rem;
    }

    /* ===== BUTTON ===== */
    .btn {
      display: inline-block;
      padding: 14px 36px;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(0, 114, 255, 0.35);
      transition: box-shadow 0.3s ease;
    }

    .btn:hover {
      box-shadow: 0 14px 32px rgba(0, 114, 255, 0.55);
    }

    /* Disable hover scale on touch devices */
    @media (hover: none) {
      .btn:hover {
        box-shadow: 0 10px 25px rgba(0, 114, 255, 0.35);
      }
    }

    .note {
      margin-top: 22px;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 480px) {
      h1 {
        font-size: 2.1rem;
      }

      p {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>

  <!-- GLOW EFFECT -->
  <div class="glow one"></div>
  <div class="glow two"></div>

  <!-- LOGO -->
  <div class="corner-logo">
    <img src="images/texly-logo.png" alt="Texly Logo">
  </div>

  <!-- CONTENT -->
  <div class="container">
    <h1>Texly</h1>
    <p>
      Thank you for your interest in Texly 💙<br>
      Powerful Arabic–English translation and text services are coming soon.
    </p>

    <!-- FORM BUTTON -->
    <a
      href="https://forms.gle/ErTmCGVyZEiP1FJX9"
      target="_blank"
      class="btn"
    >
      📝 Go to the Form
    </a>

    <div class="note">
      We truly appreciate your trust 🚀
    </div>
  </div>

</body>
</html>
