<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon - Shared Counter</title>
<style>
  body{height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); color:#fff; text-align:center; font-family:Arial;}
  .container{padding:40px; max-width:400px; width:90%; background:rgba(0,0,0,0.4); border-radius:10px;}
  h1{font-size:2.5rem; margin-bottom:20px;}
  button{background:#00c6ff; border:none; color:#fff; padding:12px 20px; font-size:1rem; border-radius:50px; cursor:pointer; margin-top:10px;}
  button:hover{transform:scale(1.05);}
  .counter{margin-top:20px; font-size:1.2rem;}
  .random-word{margin-top:10px; font-size:1.2rem; font-weight:bold; color:#00eaff;}
</style>
</head>
<body>
<div class="container">
<h1>Coming Soon</h1>
<p>Something amazing is on the way 🚀</p>
<button onclick="handleClick()">🔥 Join the Launch Group</button>
<div class="counter">Total clicks: <span id="clickCount">0</span></div>
<div class="random-word" id="randomWord"></div>
</div>

<script>
const words = ["Launching Soon 🚀","Stay Tuned 👀","Big Things Coming 💥","Almost Ready ⏳","Next Level 🔥","Be the First ⭐","New Experience ⚡","Game Changer 💎"];

// ضع هنا رابط JSONBin أو أي API عام يحوي {"count":0}
const API_URL = "https://api.jsonbin.io/v3/b/YOUR_BIN_ID/latest";
const API_KEY = "YOUR_API_KEY";

async function fetchCount(){
  const res = await fetch(API_URL, {
    headers: { "X-Master-Key": API_KEY }
  });
  const data = await res.json();
  const count = data.record.count || 0;
  document.getElementById("clickCount").textContent = count;
  return count;
}

async function updateCount(newCount){
  await fetch(API_URL, {
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Master-Key": API_KEY
    },
    body: JSON.stringify({count:newCount})
  });
}

// عند تحميل الصفحة
let count = 0;
fetchCount().then(c=>count=c);

async function handleClick(){
  count++;
  document.getElementById("clickCount").textContent = count;
  const random = words[Math.floor(Math.random()*words.length)];
  document.getElementById("randomWord").textContent = random;
  await updateCount(count);
}
</script>
</body>
</html>
