<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texly – Launching Soon</title>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function () {
      emailjs.init("guIEXPU-p_rC5m2ol");
    })();
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .corner-logo {
      position: absolute;
      top: 20px;
      left: 25px;
    }

    .corner-logo img {
      width: 90px;
    }

    .container {
      max-width: 420px;
      width: 100%;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 25px;
      opacity: 0.9;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 15px;
      border-radius: 50px;
      border: none;
      text-align: center;
      font-size: 1rem;
    }

    button {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      border: none;
      color: #fff;
      padding: 15px;
      font-size: 1.05rem;
      border-radius: 50px;
      cursor: pointer;
    }

    .success {
      margin-top: 15px;
      color: #00ffcc;
      font-weight: bold;
      display: none;
    }
  </style>
</head>

<body>

  <div class="corner-logo">
    <img src="images/texly-logo.png" alt="Texly Logo">
  </div>

  <div class="container">
    <h1>Texly</h1>
    <p>Be the first to know when we launch 🚀</p>

    <form onsubmit="sendEmail(event)">
      <input type="email" id="email" placeholder="Enter your email" required />
      <button type="submit">🚀 Notify Me</button>
    </form>

    <div class="success" id="successMessage">
      ✅ Thank you for trusting us! Check your email 💙
    </div>
  </div>

  <script>
    function sendEmail(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;

      emailjs.send(
        "service_ywtnjc5",
        "template_0w3dyph",
        { user_email: email }
      ).then(
        function () {
          document.getElementById("successMessage").style.display = "block";
          document.getElementById("email").value = "";
        },
        function (error) {
          alert("Error sending email 😢");
          console.log(error);
        }
      );
    }
  </script>

</body>
</html>
